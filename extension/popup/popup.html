<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <span>R</span>
        <div>
          <h1>Reachlyst</h1>
          <p>Sales Navigator helper</p>
        </div>
      </div>
      <div class="state" id="state">
        <span></span>
        <strong>Paused</strong>
      </div>
      <label class="tokenField">
        <span>Extension token</span>
        <textarea id="token" rows="3" placeholder="Paste your Reachlyst extension token"></textarea>
      </label>
      <button id="verify" class="verify" type="button">Verify token</button>
      <div class="actions">
        <button id="start" type="button">Start</button>
        <button id="stop" type="button">Stop</button>
      </div>
      <p id="status">Paste your token from Reachlyst, then verify it.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
